{% load static %}
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>修改密码 · Teeni 数据看板</title>
    <link rel="stylesheet" href="{% static 'dashboard/auth.css' %}" />
  </head>
  <body class="simple-auth-page">
    <form method="post" class="auth-form compact-form">
      {% csrf_token %}
      <header><h1>修改密码</h1></header>
      {{ form.as_p }}
      <button type="submit">保存新密码</button>
      <a class="text-link" href="{% url 'dashboard:index' %}">返回看板</a>
    </form>
  </body>
</html>
